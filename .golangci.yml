version: "2"

run:
  timeout: 5m

linters:
  default: all
  disable:
    - contextcheck
    - cyclop
    - depguard
    - dupl
    - dupword
    - err113
    - errchkjson
    - errorlint
    - exhaustive
    # renamed linters register under both names; disable both or the new name
    # silently re-enables under `default: all`
    - exhaustruct
    - exhaustruct_v5
    - forbidigo
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gochecknoinits
    # deprecated in favor of gomodguard_v2, which stays enabled; without a
    # blocked-modules config both are no-ops, but the old name warns
    - gomodguard
    - gocognit
    - gocritic
    - godox
    - interfacebloat
    - ireturn
    - lll
    - mnd
    - musttag
    - nestif
    - nilnil
    - nlreturn
    - noinlineerr
    - paralleltest
    - perfsprint
    - tagalign
    - tagliatelle
    - testpackage
    - unqueryvet
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    revive:
      severity: warning
      enable-all-rules: true
      rules:
        - name: argument-limit
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: file-header
          disabled: true
        - name: function-result-limit
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: function-length
          disabled: true
        - name: unexported-naming
          disabled: true
        - name: add-constant
          disabled: true
        - name: unhandled-error
          disabled: true
        - name: deep-exit
          disabled: true
        - name: unused-receiver
          disabled: true
        - name: nested-structs
          disabled: true
        - name: confusing-results
          disabled: true
        - name: empty-lines
          disabled: true
        - name: flag-parameter
          disabled: true
        - name: banned-characters
          disabled: true
        - name: comment-spacings
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - goconst
        path: _test\.go
      # the generators emit literal JSON Schema keywords and struct-tag keys;
      # naming those constants adds indirection without meaning
      - linters:
          - goconst
        path: pkg/clientgen/
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/entwico/gqlgoclientgen
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      # golden files must stay byte-identical to the generator's output
      - testdata

issues:
  fix: true
  max-issues-per-linter: 0
  max-same-issues: 0
